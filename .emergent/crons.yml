crons:
  - name: audio-retention-purge
    description: "Deletes consultation audio older than the retention window, daily at 03:17 UTC"
    cron: "17 3 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/audio-purge"
    method: POST
    enabled: true
  - name: monthly-usage-reports
    description: "Emails each hospital admin last month's usage report PDF on the 1st at 9am Riyadh time"
    cron: "0 6 1 * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/monthly-reports"
    method: POST
    enabled: true
